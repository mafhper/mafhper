<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img">
  <title>MicroHUB — icone em placa propria (derivada da SVG-mae)</title>
  <desc>Simbolo hub-node da mae sobre placa neutra escura. Uso: icone de app, avatar, atalho. Nao e o logo espremido: sem wordmark por legibilidade em tamanho pequeno. Regenerar a partir de logo.svg.</desc>
